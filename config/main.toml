# Main run: 20 logs * 4 versions * 2 skill settings * 3 repeats = 480 calls per model.
# Before preparing it: set each model's effort from the trial run, and paste the skill into
# SKILL in experiment/prompts.py (prepare refuses while it is empty). Then prepare and commit the run.
# The schedule goes log by log, so a run cut short still has whole logs.
description = "Main run: 20 logs, versions C/R/RG/E, with and without the skill, 3 repeats, both models"

[design]
seed_start = 700000        # fresh: disjoint from the trial run and every EDA seed
logs = 20
versions = ["C", "R", "RG", "E"]
instructions = ["none", "skill"]
repeats = 3
schedule_seed = 180

[generator]
records = 1600
adjust_share = 0.45
withdraw_share = 0.15
gossip_share = 0.30
nested_rate = 0.35
relative_gossip_share = 0.5
amount_step = 5
amount_max = 150
unique_amount_max = 600
budget_min = 200
budget_max = 3000

[collection]
timeout_seconds = 1800

[models.claude]
provider = "claude-code"
model = "claude-opus-5-5"
effort = "low"
max_output_tokens = 32000

[models.gpt]
provider = "codex"
model = "gpt-6-astra"
effort = "low"
max_output_tokens = 32000  # Codex cannot enforce it; longer responses are flagged hit_length_limit, as for Claude

# One flagship model per provider (proposal: Run controls).
# Freeze these before Stage 0. Every response row records the exact identifier and
# settings, and a run directory refuses to continue if they change mid-run.
#
#   reasoning           fixed per model; comparing reasoning levels is a separate experiment
#   temperature         omit to use the provider default (Claude Opus 5.5 and GPT-6 Astra reject custom values)
#   max_output_tokens   includes reasoning tokens for OpenAI and Gemini

[gpt]
provider = "openai"
model = "gpt-6-astra"            # cheaper alternative: "gpt-6.1-sol"
reasoning = "medium"             # reasoning.effort: low | medium | high | xhigh | max
max_output_tokens = 16000

[claude]
provider = "anthropic"
model = "claude-opus-5-5"        # Anthropic's most capable: "claude-fable-5-1"
reasoning = "medium"             # output_config.effort: low | medium | high | xhigh | max (thinking is always on)
max_output_tokens = 16000

[gemini]
provider = "google"
model = "gemini-3.1-pro-preview"
reasoning = "medium"             # thinking_level: low | medium | high
max_output_tokens = 16000
